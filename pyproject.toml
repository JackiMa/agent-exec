[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-exec"
version = "0.1.0"
description = "A local agent execution service shared by CLI, HTTP and MCP clients"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "mcp>=1.12,<2"]

[project.scripts]
agent-exec = "agent_exec.cli:main"
agent-execd = "agent_exec.server:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_exec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
